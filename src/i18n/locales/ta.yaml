# Hero
hero_lede: "உங்கள் தொலைபேசி உங்களுடையதாக இல்லாமல் போகப் போகிறது."
hero_countdown_label: "நாட்களில் முடக்கம்"
hero_sub: >-
  செப்டம்பர் 2026 முதல், கூகுள் பயனர்களின் அனுமதி இன்றி ஒரு அறிவிப்பற்ற மென்பொருள் புதுப்பிப்பை (silent update) வெளியிட்டுள்ளது, கூகுளில் பதிவு செய்யாத, ஒப்பந்தத்தில் கையெழுத்திடாத, கட்டணத்தைச் செலுத்தாத மற்றும் அரசு அடையாள ஆவணத்தை வழங்காத எந்தவொரு நிரலாளரின் ஆண்ட்ராய்டு செயலியாக இருந்தாலும், **கூகுள் அதை தடைச்செய்யும்**.
hero_kicker: "உலகம் முழுவதிலும் உள்ள அனைத்து செயலிகளும், அனைத்து சாதனங்களும் இதற்கு உட்படுத்தப்படும்; இதில் இருந்து விலகும் வாய்ப்பு கிடையாது."

# What Google is doing
what_heading: "கூகுள் என்ன செய்கிறது"
what_intro: >-
  ஆகஸ்ட் 2025-இல், கூகுள் ஒரு புதிய [நிபந்தனையை](https://developer.android.com/developer-verification) அறிவித்துள்ளது: செப்டம்பர் 2026 முதல், **அனைத்து ஆண்ட்ராய்டு செயலி நிரலாளர்கள், அவர்களின் மென்பொருளை எந்தவொரு சாதனத்திலும் நிறுவுவதற்கு முன்பு கூகிளின் மையப்பட்டிருகில் பதிவு செய்ய வேண்டும்**.  பிலேஸ்டோர்(PlayStore) செயலிகள் மட்டுமல்ல: அனைத்து செயலிகளும் அடங்கும். இதில் நண்பர்களுக்கு இடையே பகிரப்படும் செயலிகள், [F-Droid](https://f-droid.org) மூலம் விநியோகிக்கப்படும் செயலிகள் மற்றும் தனிப்பட்ட பயன்பாட்டிற்காக உருவாக்கப்படும் செயலிகளும் அடங்கும். சுயமாகச் செயல்படும் நிரலாளர்கள், தேவாலயம் மற்றும் சமூக குழுக்கள், மற்றும் பொழுதுபோக்காக மென்பொருளை உருவாக்குபவர்கள் கூட தங்களின் மென்பொருளை உருவாக்கவும், விநியோகிக்கவும் முடியாத நிலைக்குத் தள்ளப்படுவார்கள்.
what_registration: "பதிவுக்கு தேவையானவை "
